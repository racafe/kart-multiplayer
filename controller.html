<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kart Race Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: 'Courier New', monospace;
    }

    /* ========================================
       CONNECTION STATUS BAR
       ======================================== */
    .status-bar {
      padding: 8px 16px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      transition: background-color 0.3s, color 0.3s;
      flex-shrink: 0;
    }
    .status-bar.connecting {
      background-color: #f59e0b;
      color: #000;
    }
    .status-bar.connected {
      background-color: #22c55e;
      color: #fff;
    }
    .status-bar.disconnected {
      background-color: #ef4444;
      color: #fff;
    }
    .status-bar.error {
      background-color: #dc2626;
      color: #fff;
    }
    .status-bar.reconnecting {
      background-color: #f59e0b;
      color: #000;
    }

    /* ========================================
       PLAYER INDICATOR
       ======================================== */
    .player-indicator {
      text-align: center;
      padding: 8px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s, text-shadow 0.3s;
      flex-shrink: 0;
    }
    .player-indicator.player1 {
      color: #ef4444;
      text-shadow:
        0 0 10px rgba(239, 68, 68, 0.5),
        0 0 20px rgba(239, 68, 68, 0.3);
    }
    .player-indicator.player2 {
      color: #3b82f6;
      text-shadow:
        0 0 10px rgba(59, 130, 246, 0.5),
        0 0 20px rgba(59, 130, 246, 0.3);
    }
    .player-indicator.waiting {
      color: rgba(255, 255, 255, 0.5);
    }

    /* ========================================
       RECONNECT OVERLAY
       ======================================== */
    .reconnect-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .reconnect-overlay.visible {
      display: flex;
    }
    .reconnect-title {
      color: #f59e0b;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .reconnect-status {
      color: #888;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .reconnect-button {
      background: linear-gradient(145deg, #4ade80, #22c55e);
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .reconnect-button:active {
      transform: scale(0.95);
    }
    .reconnect-button:disabled {
      background: #666;
      color: #999;
    }
    .reconnect-attempts {
      color: #666;
      font-size: 14px;
      margin-top: 20px;
    }

    /* ========================================
       GYRO PERMISSION OVERLAY
       ======================================== */
    .gyro-permission-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 30px;
    }
    .gyro-permission-overlay.visible {
      display: flex;
    }
    .gyro-permission-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .gyro-permission-title {
      color: #f59e0b;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .gyro-permission-text {
      color: #888;
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .gyro-permission-button {
      background: linear-gradient(145deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 18px 50px;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .gyro-permission-button:active {
      transform: scale(0.95);
    }

    /* ========================================
       MAIN CONTROLLER AREA (landscape-oriented)
       ======================================== */
    .controller-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ========================================
       STEERING DISPLAY
       ======================================== */
    .steering-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 20px;
      flex-shrink: 0;
    }

    .steering-wheel {
      position: relative;
      width: 100%;
      max-width: 300px;
      height: 40px;
    }

    .steering-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 6px;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .steering-center-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 20px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.3);
    }

    .steering-fill-left,
    .steering-fill-right {
      position: absolute;
      top: 0;
      height: 100%;
      transition: width 0.05s linear;
    }

    .steering-fill-left {
      right: 50%;
      background: linear-gradient(to left, rgba(245, 158, 11, 0.8), rgba(245, 158, 11, 0.2));
      border-radius: 3px 0 0 3px;
    }

    .steering-fill-right {
      left: 50%;
      background: linear-gradient(to right, rgba(245, 158, 11, 0.8), rgba(245, 158, 11, 0.2));
      border-radius: 0 3px 3px 0;
    }

    .steering-fill-left.player1, .steering-fill-right.player1 {
      background: linear-gradient(to left, rgba(239, 68, 68, 0.8), rgba(239, 68, 68, 0.2));
    }
    .steering-fill-right.player1 {
      background: linear-gradient(to right, rgba(239, 68, 68, 0.8), rgba(239, 68, 68, 0.2));
    }
    .steering-fill-left.player2, .steering-fill-right.player2 {
      background: linear-gradient(to left, rgba(59, 130, 246, 0.8), rgba(59, 130, 246, 0.2));
    }
    .steering-fill-right.player2 {
      background: linear-gradient(to right, rgba(59, 130, 246, 0.8), rgba(59, 130, 246, 0.2));
    }

    .steering-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f59e0b;
      transform: translate(-50%, -50%);
      transition: left 0.05s linear;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    .steering-indicator.player1 {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    .steering-indicator.player2 {
      background: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }

    .steering-angle-text {
      font-size: 16px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .steering-angle-text.player1 { color: #ef4444; }
    .steering-angle-text.player2 { color: #3b82f6; }

    /* ========================================
       ACTION BUTTONS ROW
       ======================================== */
    .action-buttons {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      padding: 10px 16px 16px;
      gap: 16px;
      min-height: 0;
    }

    .action-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .action-btn-icon {
      font-size: 40px;
      margin-bottom: 6px;
      pointer-events: none;
    }

    .action-btn-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* Drift button */
    .drift-btn {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(168, 85, 247, 0.08);
    }

    .drift-btn.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.3);
      box-shadow:
        0 0 20px rgba(168, 85, 247, 0.4),
        inset 0 0 20px rgba(168, 85, 247, 0.1);
    }

    /* Item use button */
    .item-btn {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }

    .item-btn.active {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.3);
      box-shadow:
        0 0 20px rgba(245, 158, 11, 0.4),
        inset 0 0 20px rgba(245, 158, 11, 0.1);
    }

    /* ========================================
       RECALIBRATE BUTTON
       ======================================== */
    .recalibrate-bar {
      display: flex;
      justify-content: center;
      padding: 0 16px 10px;
      flex-shrink: 0;
    }

    .recalibrate-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .recalibrate-btn:active {
      color: #f59e0b;
      border-color: #f59e0b;
    }

    /* ========================================
       ROOM CODE INPUT OVERLAY
       ======================================== */
    .room-input-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 300;
      padding: 20px;
    }
    .room-input-overlay.visible {
      display: flex;
    }
    .room-input-title {
      color: #f59e0b;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      text-shadow:
        0 0 10px rgba(245, 158, 11, 0.5),
        0 0 20px rgba(245, 158, 11, 0.3);
    }
    .room-input-subtitle {
      color: #888;
      font-size: 16px;
      margin-bottom: 40px;
      text-align: center;
    }
    .room-input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 300px;
    }
    .room-input-text {
      width: 100%;
      max-width: 300px;
      height: 60px;
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid rgba(245, 158, 11, 0.3);
      border-radius: 10px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      text-align: center;
      padding: 0 20px;
      letter-spacing: 8px;
    }
    .room-input-text:focus {
      outline: none;
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .room-input-text::placeholder {
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0;
    }
    .room-connect-button {
      background: linear-gradient(145deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 16px 50px;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .room-connect-button:active {
      transform: scale(0.95);
    }
    .room-connect-button:disabled {
      background: #666;
      color: #999;
      cursor: not-allowed;
    }
    .room-input-error {
      color: #ef4444;
      font-size: 14px;
      margin-top: -10px;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="status-bar connecting" id="statusBar">Connecting...</div>

  <div class="player-indicator waiting" id="playerIndicator">Waiting for game...</div>

  <!-- Gyroscope permission overlay (iOS requires user gesture) -->
  <div class="gyro-permission-overlay" id="gyroPermissionOverlay">
    <div class="gyro-permission-icon">&#x1F3CE;</div>
    <div class="gyro-permission-title">Enable Steering</div>
    <div class="gyro-permission-text">
      This controller uses your phone's gyroscope.<br>
      Tilt your phone left and right to steer.<br><br>
      Tap below to enable motion controls.
    </div>
    <button class="gyro-permission-button" id="gyroPermissionButton">ENABLE GYROSCOPE</button>
  </div>

  <!-- Room code input overlay -->
  <div class="room-input-overlay" id="roomInputOverlay">
    <div class="room-input-title">KART RACE</div>
    <div class="room-input-subtitle" id="roomInputSubtitle">Enter the 4-character room code</div>
    <div class="room-input-container">
      <input
        type="text"
        class="room-input-text"
        id="roomInputText"
        placeholder="ABCD"
        maxlength="4"
        autocomplete="off"
        autocapitalize="characters"
      />
      <div class="room-input-error" id="roomInputError"></div>
      <button class="room-connect-button" id="roomConnectButton">CONNECT</button>
    </div>
  </div>

  <!-- Reconnect overlay -->
  <div class="reconnect-overlay" id="reconnectOverlay">
    <div class="reconnect-title" id="reconnectTitle">Disconnected</div>
    <div class="reconnect-status" id="reconnectStatus">Attempting to reconnect...</div>
    <button class="reconnect-button" id="reconnectButton">Reconnect</button>
    <div class="reconnect-attempts" id="reconnectAttempts"></div>
  </div>

  <div class="controller-area" id="controllerArea">
    <!-- Steering angle visual feedback -->
    <div class="steering-display">
      <div class="steering-wheel" id="steeringWheel">
        <div class="steering-track">
          <div class="steering-fill-left" id="steeringFillLeft"></div>
          <div class="steering-fill-right" id="steeringFillRight"></div>
        </div>
        <div class="steering-center-mark"></div>
        <div class="steering-indicator" id="steeringIndicator"></div>
      </div>
      <div class="steering-angle-text" id="steeringAngleText">0&deg;</div>
    </div>

    <!-- Recalibrate button -->
    <div class="recalibrate-bar">
      <button class="recalibrate-btn" id="recalibrateBtn">Recalibrate</button>
    </div>

    <!-- Drift + Item buttons -->
    <div class="action-buttons">
      <button class="action-btn drift-btn" id="driftBtn">
        <span class="action-btn-icon">&#x1F4A8;</span>
        <span class="action-btn-label">Drift</span>
      </button>
      <button class="action-btn item-btn" id="itemBtn">
        <span class="action-btn-icon">&#x2B50;</span>
        <span class="action-btn-label">Item</span>
      </button>
    </div>
  </div>

  <script type="module">
    // ========================================
    // CONFIGURATION
    // ========================================
    const CONTROLLER_HOSTNAME = window.location.hostname;
    const IS_SSL = window.location.protocol === 'https:';

    const IS_IP_HOST = /^[0-9.]+$/.test(CONTROLLER_HOSTNAME);
    const IS_DEV_HOST = CONTROLLER_HOSTNAME === 'localhost' || IS_IP_HOST;

    const WS_URL = `${IS_SSL ? 'wss' : 'ws'}://${window.location.host}/ws`;

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room');

    // ========================================
    // DOM ELEMENTS
    // ========================================
    const statusBar = document.getElementById('statusBar');
    const playerIndicator = document.getElementById('playerIndicator');
    const roomInputOverlay = document.getElementById('roomInputOverlay');
    const roomInputText = document.getElementById('roomInputText');
    const roomConnectButton = document.getElementById('roomConnectButton');
    const roomInputError = document.getElementById('roomInputError');
    const roomInputSubtitle = document.getElementById('roomInputSubtitle');
    const controllerArea = document.getElementById('controllerArea');
    const reconnectOverlay = document.getElementById('reconnectOverlay');
    const reconnectTitle = document.getElementById('reconnectTitle');
    const reconnectStatus = document.getElementById('reconnectStatus');
    const reconnectButton = document.getElementById('reconnectButton');
    const reconnectAttempts = document.getElementById('reconnectAttempts');

    // Gyro permission
    const gyroPermissionOverlay = document.getElementById('gyroPermissionOverlay');
    const gyroPermissionButton = document.getElementById('gyroPermissionButton');

    // Steering display
    const steeringIndicator = document.getElementById('steeringIndicator');
    const steeringFillLeft = document.getElementById('steeringFillLeft');
    const steeringFillRight = document.getElementById('steeringFillRight');
    const steeringAngleText = document.getElementById('steeringAngleText');

    // Action buttons
    const driftBtn = document.getElementById('driftBtn');
    const itemBtn = document.getElementById('itemBtn');
    const recalibrateBtn = document.getElementById('recalibrateBtn');

    // ========================================
    // STATE
    // ========================================
    let ws = null;
    let isConnected = false;
    let playerSlot = null;

    // Reconnection state
    let reconnectAttemptCount = 0;
    let reconnectTimer = null;
    let isReconnecting = false;
    const MAX_AUTO_RECONNECT_ATTEMPTS = 5;
    const RECONNECT_INTERVAL_MS = 2000;

    // Gyroscope state
    let gyroEnabled = false;
    let neutralGamma = 0; // Neutral tilt position (gamma axis = left/right)
    const MAX_STEER_ANGLE = 45; // Degrees of tilt for full steering
    let currentSteeringAngle = 0; // -1 to 1 normalized
    let isDrifting = false;

    // Throttle steering messages to ~30Hz
    const STEER_THROTTLE_MS = 33;
    let lastSteerSendTime = 0;
    let pendingSteerValue = null;
    let steerThrottleTimer = null;

    // ========================================
    // STATUS UI FUNCTIONS
    // ========================================

    function setStatus(status, message) {
      statusBar.className = 'status-bar ' + status;
      statusBar.textContent = message;
    }

    function setPlayerIndicator(slot) {
      playerSlot = slot;
      playerIndicator.className = 'player-indicator';

      if (slot === 'player1') {
        playerIndicator.classList.add('player1');
        playerIndicator.textContent = 'Player 1 - Red Kart';
        updateControllerColors('player1');
      } else if (slot === 'player2') {
        playerIndicator.classList.add('player2');
        playerIndicator.textContent = 'Player 2 - Blue Kart';
        updateControllerColors('player2');
      } else {
        playerIndicator.classList.add('waiting');
        playerIndicator.textContent = 'Waiting for game...';
        updateControllerColors(null);
      }
    }

    function updateControllerColors(slot) {
      const colorElements = [steeringIndicator, steeringFillLeft, steeringFillRight, steeringAngleText];
      for (const el of colorElements) {
        el.classList.remove('player1', 'player2');
        if (slot) el.classList.add(slot);
      }
    }

    // ========================================
    // GYROSCOPE FUNCTIONS
    // ========================================

    function needsGyroPermission() {
      return typeof DeviceOrientationEvent !== 'undefined' &&
             typeof DeviceOrientationEvent.requestPermission === 'function';
    }

    async function requestGyroPermission() {
      if (needsGyroPermission()) {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          return false;
        }
      }
      return true;
    }

    function showGyroPermissionOverlay() {
      gyroPermissionOverlay.classList.add('visible');
    }

    function hideGyroPermissionOverlay() {
      gyroPermissionOverlay.classList.remove('visible');
    }

    async function initGyroscope() {
      // On iOS, we need a user gesture to request permission
      if (needsGyroPermission()) {
        showGyroPermissionOverlay();
        return;
      }

      // On Android/desktop, just start listening
      startGyroListening();
    }

    function startGyroListening() {
      gyroEnabled = true;

      window.addEventListener('deviceorientation', handleDeviceOrientation);

      // Calibrate neutral position after a short delay to let readings stabilize
      setTimeout(() => {
        calibrateNeutral();
      }, 500);
    }

    function handleDeviceOrientation(event) {
      if (!gyroEnabled) return;

      // gamma: left-right tilt in degrees (-90 to 90)
      const gamma = event.gamma || 0;

      // Calculate steering relative to neutral position
      const deltaGamma = gamma - neutralGamma;

      // Apply non-linear sensitivity curve:
      // Small tilts (< ~15 deg) = gentle turns, large tilts = sharp turns
      const normalizedRaw = Math.max(-1, Math.min(1, deltaGamma / MAX_STEER_ANGLE));
      // Apply cubic easing for sensitivity: small tilts gentle, large tilts sharp
      const sign = normalizedRaw >= 0 ? 1 : -1;
      const absVal = Math.abs(normalizedRaw);
      // Blend between linear and cubic: 30% linear + 70% cubic
      const curved = 0.3 * absVal + 0.7 * absVal * absVal * absVal;
      currentSteeringAngle = sign * curved;

      // Update visual display
      updateSteeringDisplay(currentSteeringAngle, deltaGamma);

      // Send via WebSocket (throttled)
      sendSteeringInput(currentSteeringAngle);
    }

    function calibrateNeutral() {
      // On next orientation event, capture current gamma as neutral
      const onCalibrate = (event) => {
        neutralGamma = event.gamma || 0;
        window.removeEventListener('deviceorientation', onCalibrate);
      };
      window.addEventListener('deviceorientation', onCalibrate);
    }

    // ========================================
    // STEERING DISPLAY
    // ========================================

    function updateSteeringDisplay(normalizedAngle, rawDegrees) {
      // Move indicator: 50% = center, 0% = full left, 100% = full right
      const percent = 50 + normalizedAngle * 50;
      steeringIndicator.style.left = `${percent}%`;

      // Fill bars
      if (normalizedAngle < 0) {
        steeringFillLeft.style.width = `${Math.abs(normalizedAngle) * 50}%`;
        steeringFillRight.style.width = '0%';
      } else {
        steeringFillLeft.style.width = '0%';
        steeringFillRight.style.width = `${normalizedAngle * 50}%`;
      }

      // Angle text
      const displayDeg = Math.round(rawDegrees || 0);
      steeringAngleText.textContent = `${displayDeg > 0 ? '+' : ''}${displayDeg}\u00B0`;
    }

    // ========================================
    // WEBSOCKET SEND FUNCTIONS
    // ========================================

    function sendSteeringInput(angle) {
      if (!ws || ws.readyState !== WebSocket.OPEN || !isConnected) return;

      const roundedAngle = Math.round(angle * 1000) / 1000;
      const now = performance.now();
      const timeSinceLastSend = now - lastSteerSendTime;

      if (timeSinceLastSend >= STEER_THROTTLE_MS) {
        ws.send(JSON.stringify({
          type: 'steering_input',
          data: { angle: roundedAngle }
        }));
        lastSteerSendTime = now;
        pendingSteerValue = null;

        if (steerThrottleTimer) {
          clearTimeout(steerThrottleTimer);
          steerThrottleTimer = null;
        }
      } else {
        pendingSteerValue = roundedAngle;

        if (!steerThrottleTimer) {
          const delay = STEER_THROTTLE_MS - timeSinceLastSend;
          steerThrottleTimer = setTimeout(() => {
            steerThrottleTimer = null;
            if (pendingSteerValue !== null && ws && ws.readyState === WebSocket.OPEN && isConnected) {
              ws.send(JSON.stringify({
                type: 'steering_input',
                data: { angle: pendingSteerValue }
              }));
              lastSteerSendTime = performance.now();
              pendingSteerValue = null;
            }
          }, delay);
        }
      }
    }

    function sendDrift(active) {
      if (!ws || ws.readyState !== WebSocket.OPEN || !isConnected) return;
      ws.send(JSON.stringify({
        type: 'drift',
        data: { active }
      }));
    }

    function sendItemUse() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !isConnected) return;
      ws.send(JSON.stringify({
        type: 'item_use',
        data: {}
      }));
    }

    // ========================================
    // ACTION BUTTON EVENT LISTENERS
    // ========================================

    // Drift button: press/release
    driftBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrifting = true;
      driftBtn.classList.add('active');
      sendDrift(true);
    }, { passive: false });

    driftBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      isDrifting = false;
      driftBtn.classList.remove('active');
      sendDrift(false);
    }, { passive: false });

    driftBtn.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      isDrifting = false;
      driftBtn.classList.remove('active');
      sendDrift(false);
    }, { passive: false });

    // Mouse fallback for drift
    driftBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isDrifting = true;
      driftBtn.classList.add('active');
      sendDrift(true);
    });

    driftBtn.addEventListener('mouseup', (e) => {
      isDrifting = false;
      driftBtn.classList.remove('active');
      sendDrift(false);
    });

    driftBtn.addEventListener('mouseleave', () => {
      if (isDrifting) {
        isDrifting = false;
        driftBtn.classList.remove('active');
        sendDrift(false);
      }
    });

    // Item button: tap
    itemBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      itemBtn.classList.add('active');
      sendItemUse();
      setTimeout(() => itemBtn.classList.remove('active'), 150);
    }, { passive: false });

    itemBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      itemBtn.classList.add('active');
      sendItemUse();
      setTimeout(() => itemBtn.classList.remove('active'), 150);
    });

    // Recalibrate button
    recalibrateBtn.addEventListener('click', () => {
      calibrateNeutral();
      // Brief visual feedback
      recalibrateBtn.style.color = '#f59e0b';
      recalibrateBtn.style.borderColor = '#f59e0b';
      setTimeout(() => {
        recalibrateBtn.style.color = '';
        recalibrateBtn.style.borderColor = '';
      }, 500);
    });

    // Gyro permission button (iOS)
    gyroPermissionButton.addEventListener('click', async () => {
      const granted = await requestGyroPermission();
      hideGyroPermissionOverlay();
      if (granted) {
        startGyroListening();
      }
    });

    // ========================================
    // RECONNECT OVERLAY FUNCTIONS
    // ========================================

    function showReconnectOverlay(title, status, showButton = false) {
      reconnectTitle.textContent = title;
      reconnectStatus.textContent = status;
      reconnectButton.style.display = showButton ? 'block' : 'none';
      reconnectOverlay.classList.add('visible');
    }

    function hideReconnectOverlay() {
      reconnectOverlay.classList.remove('visible');
      reconnectAttemptCount = 0;
      isReconnecting = false;
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function updateReconnectAttemptsDisplay() {
      if (reconnectAttemptCount > 0) {
        reconnectAttempts.textContent = `Attempt ${reconnectAttemptCount} of ${MAX_AUTO_RECONNECT_ATTEMPTS}`;
      } else {
        reconnectAttempts.textContent = '';
      }
    }

    // ========================================
    // ROOM INPUT FUNCTIONS
    // ========================================

    function showRoomInput(subtitle = 'Enter the 4-character room code') {
      roomInputSubtitle.textContent = subtitle;
      roomInputText.value = '';
      roomInputError.textContent = '';
      roomInputOverlay.classList.add('visible');
      controllerArea.style.display = 'none';
      setStatus('disconnected', 'Enter room code');
      setPlayerIndicator(null);
      setTimeout(() => {
        roomInputText.focus();
      }, 100);
    }

    function hideRoomInput() {
      roomInputOverlay.classList.remove('visible');
      controllerArea.style.display = 'flex';
    }

    function handleRoomCodeSubmit() {
      const inputValue = roomInputText.value.trim().toUpperCase();

      if (!inputValue || inputValue.length !== 4) {
        roomInputError.textContent = 'Please enter a 4-character room code';
        return;
      }

      if (!/^[A-Z0-9]{4}$/.test(inputValue)) {
        roomInputError.textContent = 'Room code must be letters and numbers only';
        return;
      }

      roomCode = inputValue;
      roomInputError.textContent = '';
      hideRoomInput();
      connect();
    }

    // ========================================
    // WEBSOCKET CONNECTION
    // ========================================

    function connect(isReconnect = false) {
      if (!roomCode) {
        showRoomInput();
        return;
      }

      if (isReconnect) {
        setStatus('reconnecting', 'Reconnecting...');
      } else {
        setStatus('connecting', 'Connecting...');
      }

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        if (isReconnect && playerSlot) {
          ws.send(JSON.stringify({
            type: 'reconnect',
            data: { roomCode, clientType: playerSlot }
          }));
        } else {
          ws.send(JSON.stringify({
            type: 'join_room',
            data: { roomCode }
          }));
        }
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleMessage(message);
      };

      ws.onerror = () => {
        setStatus('error', 'Connection error');
        isConnected = false;
        handleConnectionLost();
      };

      ws.onclose = () => {
        if (isConnected) {
          isConnected = false;
          handleConnectionLost();
        }
      };
    }

    // ========================================
    // CONNECTION LOSS HANDLING
    // ========================================

    function handleConnectionLost() {
      if (isReconnecting) return;

      isReconnecting = true;
      reconnectAttemptCount = 0;
      showReconnectOverlay('Disconnected', 'Attempting to reconnect...');
      startAutoReconnect();
    }

    function startAutoReconnect() {
      if (reconnectAttemptCount >= MAX_AUTO_RECONNECT_ATTEMPTS) {
        setStatus('disconnected', 'Auto-reconnect failed');
        showReconnectOverlay(
          'Connection Lost',
          'Auto-reconnect timed out',
          true
        );
        reconnectAttempts.textContent = '';
        return;
      }

      reconnectAttemptCount++;
      updateReconnectAttemptsDisplay();
      reconnectStatus.textContent = 'Attempting to reconnect...';

      reconnectTimer = setTimeout(() => {
        if (!isConnected) {
          connect(true);

          reconnectTimer = setTimeout(() => {
            if (!isConnected && isReconnecting) {
              startAutoReconnect();
            }
          }, RECONNECT_INTERVAL_MS);
        }
      }, reconnectAttemptCount === 1 ? 0 : RECONNECT_INTERVAL_MS);
    }

    function manualReconnect() {
      reconnectButton.disabled = true;
      reconnectStatus.textContent = 'Connecting...';
      reconnectAttemptCount = 0;

      connect(true);

      setTimeout(() => {
        reconnectButton.disabled = false;
      }, 2000);
    }

    // ========================================
    // MESSAGE HANDLING
    // ========================================

    function handleMessage(message) {
      switch (message.type) {
        case 'room_joined':
          isConnected = true;
          setStatus('connected', 'Connected');
          hideReconnectOverlay();
          if (message.data?.playerSlot) {
            setPlayerIndicator(message.data.playerSlot);
          }
          // Initialize gyroscope after connecting
          if (!gyroEnabled) {
            initGyroscope();
          }
          break;

        case 'reconnected':
          isConnected = true;
          setStatus('connected', 'Reconnected');
          hideReconnectOverlay();
          if (message.data?.playerSlot) {
            setPlayerIndicator(message.data.playerSlot);
          }
          break;

        case 'error':
          setStatus('error', message.data?.message || 'Error');
          const errorMsg = message.data?.message || '';
          if (errorMsg.includes('Room') && (errorMsg.includes('not found') || errorMsg.includes('expired'))) {
            isReconnecting = false;
            if (ws) {
              ws.close();
              ws = null;
            }
            isConnected = false;
            roomCode = null;
            playerSlot = null;
            hideReconnectOverlay();
            showRoomInput('Room not found or expired. Enter a new room code');
          }
          break;

        case 'peer_disconnected':
          setStatus('disconnected', 'Opponent disconnected');
          break;

        case 'peer_reconnected':
          setStatus('connected', 'Connected');
          break;

        case 'room_closed':
          handleRoomClosed();
          break;

        case 'game_over':
          handleGameOver(message.data?.winner);
          break;

        case 'new_game':
          handleNewGame();
          break;
      }
    }

    function handleRoomClosed() {
      if (ws) {
        ws.close();
        ws = null;
      }
      isConnected = false;
      roomCode = null;
      playerSlot = null;
      showRoomInput('Race ended. Enter a new room code to race again');
    }

    // ========================================
    // GAME OVER / NEW GAME HANDLING
    // ========================================

    let isWaitingForNewGame = false;

    function handleGameOver(winner) {
      isWaitingForNewGame = true;
      const isWinner = winner === playerSlot;
      const statusMsg = isWinner ? 'You won! Waiting for new game...' : 'Game over. Waiting for new game...';
      setStatus('connected', statusMsg);

      if (playerSlot === 'player1') {
        playerIndicator.textContent = isWinner ? 'Player 1 - WINNER!' : 'Player 1 - Waiting...';
      } else if (playerSlot === 'player2') {
        playerIndicator.textContent = isWinner ? 'Player 2 - WINNER!' : 'Player 2 - Waiting...';
      }
    }

    function handleNewGame() {
      isWaitingForNewGame = false;
      setStatus('connected', 'Connected');

      if (playerSlot === 'player1') {
        playerIndicator.textContent = 'Player 1 - Red Kart';
      } else if (playerSlot === 'player2') {
        playerIndicator.textContent = 'Player 2 - Blue Kart';
      }
    }

    // ========================================
    // GLOBAL EVENT PREVENTION
    // ========================================

    document.addEventListener('touchmove', (e) => {
      if (roomInputOverlay.classList.contains('visible')) return;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());

    statusBar.addEventListener('click', () => {
      if (!isConnected && ws?.readyState !== WebSocket.CONNECTING) {
        connect(true);
      }
    });

    reconnectButton.addEventListener('click', manualReconnect);

    roomInputText.addEventListener('input', (e) => {
      const value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      e.target.value = value;
      roomInputError.textContent = '';
    });

    roomInputText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleRoomCodeSubmit();
      }
    });

    roomConnectButton.addEventListener('click', handleRoomCodeSubmit);

    // ========================================
    // INITIALIZATION
    // ========================================

    // Set initial steering display
    updateSteeringDisplay(0, 0);

    if (!roomCode) {
      showRoomInput();
    } else {
      connect();
    }
  </script>
</body>
</html>
